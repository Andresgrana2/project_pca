<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>[x-cloak] { display: none !important; }</style>
    <script defer src="/statics/js/order.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body class="bg-body-tertiary">
    <main class="container py-5" x-data="orderForm()">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <header class="mb-4">
                    <h1 class="h3">Nuevo pedido</h1>
                    <p class="text-body-secondary mb-0">Completa los datos para calcular el valor de tu envío.</p>
                </header>

                <noscript><p class="alert alert-warning">Activa JavaScript para utilizar este formulario.</p></noscript>

                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <form novalidate @submit.prevent="submit()"
                              @input="clearFeedback($event.target.name)"
                              @change="clearFeedback($event.target.name)">
                            <fieldset disabled :disabled="submitting">
                                <legend class="visually-hidden">Datos del pedido</legend>

                                <div class="mb-3">
                                    <label for="weight" class="form-label">Peso (kg)</label>
                                    <input id="weight" name="weight" type="number" class="form-control"
                                           min="0.01" max="20" step="any" required placeholder="Ej. 2.5"
                                           x-model="form.weight" :class="{ 'is-invalid': errors.weight }"
                                           :aria-invalid="Boolean(errors.weight)"
                                           aria-describedby="weight-help weight-error">
                                    <div id="weight-help" class="form-text">Entre 0,01 y 20 kg.</div>
                                    <div id="weight-error" class="invalid-feedback" x-text="errors.weight"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="order-type" class="form-label">Tipo de envío</label>
                                    <select id="order-type" name="order_type" class="form-select" required
                                            x-model="form.order_type" :class="{ 'is-invalid': errors.order_type }"
                                            :aria-invalid="Boolean(errors.order_type)" aria-describedby="order-type-error">
                                        <option value="">Selecciona un tipo</option>
                                        <option value="STANDARD">Estándar</option>
                                        <option value="EXPRESS">Exprés (+25 %)</option>
                                    </select>
                                    <div id="order-type-error" class="invalid-feedback" x-text="errors.order_type"></div>
                                </div>

                                <div class="mb-4">
                                    <label for="discount" class="form-label">Tipo de cliente</label>
                                    <select id="discount" name="discount" class="form-select" required
                                            x-model="form.discount" :class="{ 'is-invalid': errors.discount }"
                                            :aria-invalid="Boolean(errors.discount)" aria-describedby="discount-error">
                                        <option value="">Selecciona un tipo</option>
                                        <option value="NEW">Nuevo (sin descuento)</option>
                                        <option value="FREQUENT">Frecuente (10 % de descuento)</option>
                                        <option value="VIP">VIP (20 % de descuento)</option>
                                    </select>
                                    <div id="discount-error" class="invalid-feedback" x-text="errors.discount"></div>
                                </div>

                                <button type="submit" class="btn btn-primary w-100">
                                    <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"
                                          x-cloak x-show="submitting"></span>
                                    <span x-text="submitting ? 'Calculando…' : 'Calcular pedido'">Calcular pedido</span>
                                </button>
                            </fieldset>
                        </form>

                        <div class="alert alert-danger mt-4 mb-0" role="alert" x-cloak x-show="error" x-text="error"></div>

                        <section class="border-top mt-4 pt-4" aria-live="polite" aria-atomic="true"
                                 x-cloak x-show="result">
                            <h2 class="h6 text-body-secondary">Total del pedido</h2>
                            <p class="fs-2 fw-semibold mb-0" x-text="formatTotal(result?.total_value)"></p>
                            <p class="text-body-secondary small mb-0">Incluye tarifa base, peso y ajustes seleccionados.</p>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
